# Gold evaluation set for FundFacts AI (Phase 8).
# type:    expected answer type
# source:  expected cited source_id (prefix match), for answers and scheme-specific refusals
# expect:  text that must appear in the answer (case-insensitive); a list means any one of them
#          (LLM answers paraphrase, so concept questions accept several correct phrasings)
# Values were hand-checked against the source PDFs (see tests/test_phase4_facts.py).

# ---------------------------------------------------------------- scheme facts
- {q: "What is the expense ratio of HDFC Flexi Cap Fund?", type: answer, source: hdfc_factsheet_sep_2026, expect: "0.67%"}
