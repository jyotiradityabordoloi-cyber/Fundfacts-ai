<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FundFacts AI</title>
<meta name="description" content="Facts-only answers about five HDFC Mutual Fund schemes, each with one official source. No investment advice.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300d09c'/%3E%3Cpath d='M10 23V9h12M10 16h8' stroke='%230a0a0a' stroke-width='3.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  // theme: saved choice, default dark (set before paint to avoid a flash)
  (function () { try { var t = localStorage.getItem("ff-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<style>
  /* FundFacts AI - clean chat UI.
     Three colours only (black, green, white); every other shade is one of them at an opacity.
     The interface is neutral: green marks the brand, the send button, links and focus - nothing else.
     Tokens: radius 8 / 12 / 18, type 13 (meta) / 14 (UI) / 16 (reading), 4px spacing, one ease. */
  :root {
    --black: 10, 10, 10; --white: 255, 255, 255; --green: 0, 208, 156; --sidebar-w: 264px;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
    --t-meta: 13px; --t-ui: 14px; --t-read: 16px;
    --ease: cubic-bezier(.2, .8, .2, 1); --m-in: 150ms; --m-out: 120ms; --m-press: 90ms;
    --tap: 36px; --col: 760px;
  }
  :root[data-theme="dark"] {
    --bg: rgb(var(--black)); --fg: rgb(var(--white)); --side: rgb(17, 17, 17); --card: rgb(var(--black));
    --bubble: rgba(var(--white), .08); --hover: rgba(var(--white), .06);
    --line: rgba(var(--white), .12); --line-strong: rgba(var(--white), .22);
    --muted: rgba(var(--white), .68); --faint: rgba(var(--white), .55);
    --accent: rgb(var(--green)); --accent-soft: rgba(var(--green), .14); --accent-ink: rgb(var(--green));
    --accent-hover: color-mix(in srgb, rgb(var(--green)) 86%, white);
    --on-accent: rgb(var(--black)); --overlay: rgba(var(--black), .7); --focus: rgb(var(--green));
    --lift: 0 8px 24px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: rgb(var(--white)); --fg: rgb(var(--black)); --side: rgb(246, 246, 246); --card: rgb(var(--white));
    --bubble: rgba(var(--black), .06); --hover: rgba(var(--black), .05);
    --line: rgba(var(--black), .14); --line-strong: rgba(var(--black), .26);
    --muted: rgba(var(--black), .68); --faint: rgba(var(--black), .58);
    --accent: rgb(var(--green)); --accent-soft: rgba(var(--green), .14); --accent-ink: rgb(var(--black));
    --accent-hover: color-mix(in srgb, rgb(var(--green)) 86%, black);
    --on-accent: rgb(var(--black)); --overlay: rgba(var(--black), .4); --focus: rgb(var(--black));
    --lift: 0 8px 24px rgba(var(--black), .08);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: var(--t-ui)/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; }
  button, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { flex: none; }

  /* ---------- shell: one row pinned to the viewport; only the thread scrolls ---------- */
  .shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
  .shell.collapsed { grid-template-columns: 0 1fr; }
  .shell.collapsed .sidebar { visibility: hidden; }

  /* ---------- sidebar ---------- */
  .sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .side-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
  .logo { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--accent); display: grid; place-items: center; flex: none; }
  .brand { font-size: 16px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .brand span { color: var(--accent); }
  :root[data-theme="light"] .brand span { color: inherit; }
  .new-chat { margin: 4px 12px 16px; justify-content: flex-start; }
  .history { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; align-content: start; }
  .conv { display: block; width: 100%; min-height: var(--tap); text-align: left; border: 0; background: none; border-radius: var(--r-sm); padding: 8px 10px; cursor: pointer; font-size: var(--t-ui); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: background var(--m-out) var(--ease), color var(--m-out) var(--ease); }
  .conv:hover { background: var(--hover); color: var(--fg); transition-duration: var(--m-in); }
  .conv[aria-current="true"] { background: var(--bubble); color: var(--fg); font-weight: 500; }
  .side-empty { font-size: var(--t-meta); color: var(--faint); padding: 4px 10px; }
  .side-foot { padding: 14px 16px; font-size: var(--t-meta); color: var(--faint); line-height: 1.5; display: grid; gap: 4px; }

  /* ---------- main column ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
  .topbar, .composer { flex: none; }
  .topbar { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 12px; }
  .topbar h1 { margin: 0 0 0 4px; font-size: var(--t-ui); font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .topbar .brand-mobile { display: none; }

  /* ---------- buttons: one shape; the green send button is the only filled one in the chat ---------- */
  .btn { display: inline-flex; align-items: center; gap: 8px; height: var(--tap); border-radius: var(--r-md); padding: 0 12px; font-size: var(--t-ui); font-weight: 500; cursor: pointer; border: 1px solid var(--line); background: transparent; white-space: nowrap; color: var(--fg);
    transition: transform var(--m-out) var(--ease), background var(--m-out) var(--ease), border-color var(--m-out) var(--ease); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .icon-btn { width: var(--tap); padding: 0; justify-content: center; }
  .btn:disabled { opacity: .4; cursor: default; }
  @media (hover: hover) and (pointer: fine) {
    .btn:not(:disabled):hover { transform: translateY(-1px); background: var(--hover); border-color: var(--line-strong); color: var(--fg); transition-duration: var(--m-in); }
    .btn.ghost:not(:disabled):hover { border-color: transparent; }
    .btn.primary:not(:disabled):hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
  }
  .btn:not(:disabled):active { transform: translateY(1px) scale(.985); transition-duration: var(--m-press); }

  /* ---------- thread ---------- */
  .thread { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; overscroll-behavior: contain; }
  .thread-inner { max-width: var(--col); margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 28px; }

  /* empty state: the heading, the question box and the starters sit together in the middle of the screen */
  .main.is-empty .thread { flex: 0 1 auto; margin-top: auto; }
  .main.is-empty .thread-inner { padding-bottom: 8px; }
  .main.is-empty .composer { margin-bottom: auto; padding-bottom: calc(24px + 6vh); }
  .welcome { text-align: center; padding-top: 8px; }
  .welcome .logo { width: 44px; height: 44px; border-radius: var(--r-md); margin: 0 auto 18px; }
  .welcome h2 { margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.03em; }
  .welcome p { margin: 10px auto 0; max-width: 520px; color: var(--muted); font-size: var(--t-read); line-height: 1.6; }

  /* ---------- messages ---------- */
  .msg { display: flex; flex-direction: column; animation: rise .22s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble { max-width: min(80%, 600px); background: var(--bubble); border-radius: var(--r-lg); border-bottom-right-radius: 6px; padding: 10px 16px; font-size: var(--t-read); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .bubble.masked { color: var(--muted); font-style: italic; }
  .ctx-note { margin-top: 6px; font-size: var(--t-meta); color: var(--faint); }
  .state-label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: var(--t-meta); font-weight: 600; color: var(--muted); }
  .answer-text { font-size: var(--t-read); line-height: 1.7; overflow-wrap: anywhere; }
  .typing { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: var(--t-ui); min-height: 28px; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 1s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry { margin-top: 12px; align-self: flex-start; }

  /* the one official source: a compact card that opens the document at the cited page */
  .source { margin-top: 14px; display: flex; align-items: center; gap: 12px; max-width: 560px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; text-decoration: none; background: var(--card);
    transition: transform var(--m-out) var(--ease), border-color var(--m-out) var(--ease), box-shadow var(--m-out) var(--ease); }
  .source .ic { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
  .source .body { min-width: 0; flex: 1; }
  .source .t { display: block; font-size: var(--t-ui); font-weight: 600; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source .h { display: block; font-size: var(--t-meta); color: var(--muted); }
  .source .go { color: var(--faint); }
  .ref-line { margin-top: 8px; font-size: var(--t-meta); color: var(--faint); }
  .ref { color: var(--muted); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .ref:hover { color: var(--fg); text-decoration-color: currentColor; }

  /* one quiet line under each answer: actions, how it was written, freshness, why */
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 12px; margin-top: 10px; font-size: var(--t-meta); color: var(--faint); }
  .acts { display: flex; align-items: center; gap: 2px; margin-left: -6px; }
  .info { line-height: 1.5; }
  .act { border: 0; background: none; border-radius: var(--r-sm); width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--faint); transition: background var(--m-out) var(--ease), color var(--m-out) var(--ease), transform var(--m-out) var(--ease); }
  .act:hover { background: var(--hover); color: var(--fg); transition-duration: var(--m-in); }
  .act:active { transform: scale(.94); transition-duration: var(--m-press); }
  .act[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-soft); }
  .why { border: 0; background: none; padding: 4px 6px; margin-left: 2px; border-radius: var(--r-sm); font-size: var(--t-meta); color: var(--muted); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .why:hover { color: var(--fg); }
  .act-msg { margin-left: 4px; }
  .why-panel { margin-top: 8px; padding: 2px 0 2px 14px; border-left: 2px solid var(--line); font-size: var(--t-meta); color: var(--muted); }
  .ev { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .ev .id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: var(--t-meta); word-break: break-all; color: var(--fg); }
  .ev .q { display: block; margin-top: 2px; }

  /* follow-ups: only under the latest answer */
  .followups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .fu { border: 1px solid var(--line); background: var(--card); border-radius: var(--r-md); padding: 7px 12px; min-height: var(--tap); font-size: var(--t-ui); text-align: left; cursor: pointer; color: var(--fg);
    transition: transform var(--m-out) var(--ease), border-color var(--m-out) var(--ease), box-shadow var(--m-out) var(--ease); }
  @media (hover: hover) and (pointer: fine) {
    .source:hover, .fu:hover, .pill:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--lift); transition-duration: 180ms; }
  }
  .fu:active, .pill:active { transform: scale(.98); transition-duration: var(--m-press); }

  /* ---------- composer ---------- */
  .composer { padding: 8px 20px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); }
  .composer-inner { max-width: var(--col); margin: 0 auto; padding: 0 0; }
  .context { display: none; align-items: center; gap: 6px; width: fit-content; margin: 0 0 8px; padding: 2px 4px 2px 12px; border: 1px solid var(--line); border-radius: var(--r-md); font-size: var(--t-meta); color: var(--muted); }
  .context.on { display: flex; }
  .context b { color: var(--fg); font-weight: 600; }
  .context button { border: 0; background: none; border-radius: var(--r-sm); width: 28px; height: 28px; padding: 0; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
  .context button:hover { background: var(--hover); color: var(--fg); }
  .bar { display: flex; gap: 8px; align-items: flex-end; background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 8px 8px 8px 6px; transition: border-color var(--m-in) var(--ease), box-shadow var(--m-in) var(--ease); }
  .bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* 16px so phones never zoom the page when the field takes focus */
  .bar textarea { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); padding: 7px 10px; outline: none; resize: none; max-height: 168px; font-size: var(--t-read); line-height: 1.5; }
  .bar textarea::placeholder { color: var(--faint); }
  .count { align-self: center; font-size: var(--t-meta); color: var(--faint); font-variant-numeric: tabular-nums; }
  .send { width: var(--tap); height: var(--tap); padding: 0; justify-content: center; border-radius: var(--r-md); }
  .fine { display: flex; justify-content: center; gap: 4px 12px; flex-wrap: wrap; margin-top: 10px; font-size: var(--t-meta); color: var(--faint); text-align: center; }
  .fine strong { color: var(--muted); font-weight: 600; }

  /* starters: shown only before the first question */
  .starters { display: none; margin-top: 16px; }
  .main.is-empty .starters { display: block; }
  .chips { display: grid; border-top: 1px solid var(--line); }
  .chip { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 10px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-size: 15px; color: var(--muted); cursor: pointer; transition: color var(--m-out) var(--ease), background var(--m-out) var(--ease); }
  .chip svg { color: var(--faint); transition: transform var(--m-out) var(--ease), color var(--m-out) var(--ease); }
  .chip:hover { color: var(--fg); background: var(--hover); transition-duration: var(--m-in); }
  .chip:hover svg { color: var(--accent-ink); transform: translateX(3px); }
  .pills { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-top: 18px; }
  .pills-label { font-size: var(--t-meta); color: var(--faint); margin-right: 2px; }
  .pill { border: 1px solid var(--line); background: var(--card); border-radius: var(--r-md); padding: 0 12px; height: 32px; font-size: var(--t-meta); color: var(--muted); cursor: pointer;
    transition: transform var(--m-out) var(--ease), border-color var(--m-out) var(--ease), box-shadow var(--m-out) var(--ease), color var(--m-out) var(--ease); }
  .pill:hover { color: var(--fg); }

  /* ---------- explore drawer ---------- */
  .scrim { position: fixed; inset: 0; background: var(--overlay); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg); border-left: 1px solid var(--line); z-index: 21; transform: translateX(100%); transition: transform .24s var(--ease); display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
  .drawer-head h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-body { overflow-y: auto; padding: 16px 20px 32px; display: grid; gap: 12px; align-content: start; }
  .drawer-note { margin: 0; font-size: var(--t-meta); color: var(--muted); }
  .scheme-list { display: grid; border-top: 1px solid var(--line); }
  .scheme-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; transition: background var(--m-out) var(--ease); }
  .scheme-row:hover { background: var(--hover); transition-duration: var(--m-in); }
  .scheme-row .t { display: block; font-size: 15px; font-weight: 600; }
  .scheme-row .s { display: block; font-size: var(--t-meta); color: var(--muted); }
  .scheme-row svg { margin-left: auto; color: var(--faint); }
  .facts { display: grid; border-top: 1px solid var(--line); }
  .fact { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .fact .k { font-size: var(--t-meta); font-weight: 500; color: var(--muted); }
  .fact .v { margin-top: 2px; font-size: 15px; line-height: 1.55; }
  .fact .v.long { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .fact .v.long.open { display: block; }
  .fact .more { margin-top: 4px; border: 0; background: none; padding: 0; color: var(--muted); font-size: var(--t-meta); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .fact .src { margin-top: 6px; font-size: var(--t-meta); color: var(--faint); }
  .fact .src a { color: var(--muted); text-underline-offset: 3px; }
  .missing { font-size: var(--t-meta); color: var(--muted); }
  .drawer .chips { margin-top: 4px; }
  .drawer-label { margin: 8px 0 0; font-size: var(--t-meta); font-weight: 500; color: var(--muted); }

  /* ---------- touch screens: every control at least 44px ---------- */
  @media (pointer: coarse) {
    :root { --tap: 44px; }
    .act { width: 44px; height: 44px; }
    .context button { width: 44px; height: 44px; }
    .pill { height: 44px; }
    .why { min-height: 44px; }
    .ref { display: inline-flex; align-items: center; min-height: 44px; }
    .ref-note { margin-top: -6px; }
    .ref-line { margin-top: 0; display: flex; flex-direction: column; align-items: flex-start; }
  }

  /* ---------- phones ---------- */
  .side-scrim { display: none; }
  @media (max-width: 860px) {
    .shell, .shell.collapsed { grid-template-columns: 1fr; }
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 31; transform: translateX(-100%); transition: transform .24s var(--ease); visibility: visible !important; }
    .shell.mobile-open .sidebar { transform: none; }
    .side-scrim { display: block; position: fixed; inset: 0; background: var(--overlay); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
    .shell.mobile-open .side-scrim { opacity: 1; pointer-events: auto; }
    .topbar { padding: 0 8px; border-bottom: 1px solid var(--line); }
    .topbar .brand-mobile { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .topbar h1 { display: none; }
    .btn .txt { display: none; }
    .btn.has-txt { width: var(--tap); padding: 0; justify-content: center; }
    .thread-inner { padding: 20px 16px 40px; gap: 24px; }
    .composer { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
    .main.is-empty .composer { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .welcome { padding-top: 0; }
    .welcome h2 { font-size: 24px; }
    .welcome p { font-size: 15px; }
    .welcome .logo { display: none; }          /* the top bar already carries the mark on phones */
    .main.is-empty .thread-inner { padding-top: 12px; }
    .starters { margin-top: 10px; }
    .pills { margin-top: 12px; gap: 6px; }
    .msg.user .bubble { max-width: 88%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-property: color, background-color, border-color, opacity !important; scroll-behavior: auto !important; }
    .btn:hover, .btn:active, .source:hover, .fu:hover, .fu:active, .pill:hover, .pill:active, .act:active, .chip:hover svg { transform: none !important; }
    .spin { border-color: var(--accent); }
  }
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="side-top">

/* ---------------- static knowledge (no answers here - only UI hints) ---------------- */

const FIELD_WORDS = { expense_ratio: /expense ratio|\bter\b/i, exit_load: /exit load/i, min_sip: /\bsip\b/i, min_lumpsum: /minimum (investment|application|amount)|lump ?sum/i,
  lock_in: /lock[\s-]?in/i, riskometer: /risk/i, benchmark: /benchmark/i, fund_manager: /manag/i, objective: /objective/i };
const CONCEPTS = [
  [/\bnav\b|net asset value/i, ["What is an expense ratio?", "What is a consolidated account statement?", "What is a riskometer?"]],
  [/expense ratio|\bter\b/i, ["What is NAV?", "What is the expense ratio of HDFC Flexi Cap Fund?", "What is an exit load?"]],
  [/exit load|redeem|redemption/i, ["What is the exit load of HDFC Large Cap Fund?", "What is NAV?", "What is an expense ratio?"]],
  [/elss|80c|tax sav/i, ["What is the lock-in period of HDFC ELSS Tax Saver Fund?", "What is the exit load of HDFC ELSS Tax Saver Fund?", "What is a riskometer?"]],

const OFFICIAL_HOSTS = new Set(["files.hdfcfund.com", "www.hdfcfund.com", "portal.amfiindia.com", "www.amfiindia.com", "www.sebi.gov.in", "investor.sebi.gov.in"]);

const STATE_LABEL = {
  refusal_advice: "Facts only - no investment advice", refusal_returns: "Returns and performance aren't shared",
  refusal_pii: "Personal information isn't accepted", not_found: "Not in my official sources", error: "Something went wrong",

let schemes = SCHEMES_FALLBACK, examples = EXAMPLES_FALLBACK;
let convs = [], current = null, pending = false;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const short = (name) => name.replace(/^HDFC /, "").replace(/ Fund$/, "");
const schemeById = (id) => schemes.find((s) => s.scheme_id === id);
const scrollDown = () => { const t = $("thread"); t.scrollTop = t.scrollHeight; };
const clock = (d) => d ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";

function detectScheme(text) {
  const t = " " + (text || "").toLowerCase().replace(/[^a-z0-9\- ]/g, " ") + " ";
  let best = null, len = 0;
  for (const [id, list] of Object.entries(ALIASES)) for (const a of list) {
    const re = new RegExp("(^|[^a-z])" + a.replace(/[-]/g, "\\-") + "(?![a-z])");
    if (re.test(t) && a.length > len) { best = id; len = a.length; }
  }
  return best;
}
function officialUrl(url) { try { const u = new URL(url); return u.protocol === "https:" && OFFICIAL_HOSTS.has(u.hostname); } catch (e) { return false; } }
// Open a cited PDF at the cited page (browsers' PDF viewers honour #page=N) so nobody has to scroll a long document.
function pageLink(url, title) { const { page } = splitTitle(title); return page && /\.pdf$/i.test(new URL(url).pathname) ? `${url}#page=${page}` : url; }
// Third-party reference pages (Groww) for the five schemes. NOT sources: never fetched, never cited, never used to answer;
// shown only as a clearly labelled "easier read" link under the official citation.
const GROWW = {
  hdfc_large_cap: "https://groww.in/mutual-funds/hdfc-large-cap-fund-direct-growth",
  hdfc_flexi_cap: "https://groww.in/mutual-funds/hdfc-equity-fund-direct-growth",   // Groww keeps the fund's former name (HDFC Equity Fund) in the URL
  hdfc_elss: "https://groww.in/mutual-funds/hdfc-elss-tax-saver-fund-direct-plan-growth",
  hdfc_small_cap: "https://groww.in/mutual-funds/hdfc-small-cap-fund-direct-growth",
  hdfc_baf: "https://groww.in/mutual-funds/hdfc-balanced-advantage-fund-direct-growth",
};
const GROWW_AMC = "https://groww.in/mutual-funds/amc/hdfc-mutual-funds";
function growwLink(url, label) {
  const line = el("div", "ref-line");
  const a = el("a", "ref", label); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer nofollow";
  a.title = "Opens Groww. It also shows returns and invest buttons - nothing there is advice.";

}
function splitTitle(title) { const m = /^(.*?),\s*page\s+(\d+)$/i.exec(title || ""); return m ? { title: m[1], page: m[2] } : { title: title || "", page: null }; }
// scheme + field an answer was about (fact cards encode both in the evidence id)
function answerTopic(r, question) {
  const ev = (r.evidence && r.evidence[0] && r.evidence[0].chunk_id) || "";
  const m = /::fact_(hdfc_[a-z_]+?)_(expense_ratio|exit_load|min_sip|min_lumpsum|lock_in|riskometer|benchmark|fund_manager|category|objective)$/.exec(ev);
  if (m) return { scheme: m[1], field: m[2] };
  // refusal / not-found texts list every covered scheme, so only a real answer's text identifies its scheme
  const scheme = (r.type === "answer" && detectScheme(r.text)) || detectScheme(question);
  const field = Object.keys(FIELD_WORDS).find((f) => FIELD_WORDS[f].test(question)) || null;
  return { scheme, field };
}

/* ---------------- theme ---------------- */
function applyTheme(t) {

/* ---------------- sidebar ---------------- */
const mobile = () => window.matchMedia("(max-width: 860px)").matches;

/* ---------------- conversations ----------------
   Kept in this tab's sessionStorage so a refresh doesn't lose them; the browser deletes it when the tab
   closes. Never sent to the server, never in localStorage. Only completed exchanges are saved: a question
   is written only after the server has answered it (so a PII question, which the server refuses and we
   mask, is never written), and unanswered or failed questions are not saved at all. */
const STORE_KEY = "ff-chats", MAX_SAVED = 20;
const titleOf = (u) => u.masked ? "Personal information (hidden)" : (u.text.length > 48 ? u.text.slice(0, 46) + "…" : u.text);
function snapshot(c) {
  const items = [];
  c.items.forEach((u, i) => {
    const b = c.items[i + 1];
    if (u.role !== "user" || !b || b.role !== "bot" || b.state !== "done") return;
    items.push({ role: "user", text: u.masked ? "" : u.text, masked: !!u.masked, contextName: u.contextName || null, schemeId: u.schemeId || null, at: u.at },
               { role: "bot", state: "done", answer: b.answer, followups: b.followups || [], topic: b.topic || {}, feedback: b.feedback || null, at: b.at });
  });
  return items.length ? { id: c.id, title: titleOf(items[0]), items, pinned: c.pinned || null, lastScheme: c.lastScheme || null } : null;
}
function save() {
  try {
    const data = { current: current && current.id, convs: convs.map(snapshot).filter(Boolean).slice(0, MAX_SAVED) };
    if (data.convs.length) sessionStorage.setItem(STORE_KEY, JSON.stringify(data));
    else sessionStorage.removeItem(STORE_KEY);
  } catch (e) {}  // storage blocked or full: chats simply stay in memory
}
function restore() {
  try {
    const data = JSON.parse(sessionStorage.getItem(STORE_KEY) || "null");
    if (!data || !Array.isArray(data.convs) || !data.convs.length) return false;
    convs = data.convs.map((c) => ({ ...c, items: c.items.map((it) => ({ ...it, at: it.at ? new Date(it.at) : null })) }));
    current = convs.find((c) => c.id === data.current) || null;
    if (!current) newConv(); else render();   // last view was an empty "New chat": open a fresh one
    return true;
  } catch (e) { return false; }
}
function newConv() {
  const existing = convs.find((c) => c.items.length === 0);
  if (existing) { current = existing; render(); return; }
  current = { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), title: "New chat", items: [], pinned: null, lastScheme: null };
  convs.unshift(current);
  render();
}
function renderHistory() {
  const h = $("history"); h.innerHTML = "";
  const used = convs.filter((c) => c.items.length);
  if (!used.length) h.appendChild(el("div", "side-empty", "Your questions will appear here."));
  used.forEach((c) => {
    const b = el("button", "conv", c.title); b.type = "button";
    b.setAttribute("aria-current", c === current ? "true" : "false");

}
$("newChat").onclick = () => { newConv(); if (mobile()) setSidebar(false); $("q").focus(); };
$("clearChat").onclick = () => {
  if (!current || !current.items.length || pending) return;
  current.items = []; current.title = "New chat"; current.lastScheme = null;

};

/* ---------------- rendering ---------------- */
function render() {
  const empty = !current.items.length;
  renderHistory();
  $("main").classList.toggle("is-empty", empty);
  $("convTitle").textContent = empty ? "" : current.title;
  $("clearChat").hidden = empty;
  const chat = $("chat"); chat.innerHTML = "";
  if (empty) { chat.appendChild(welcome()); renderStarters(); }
  const last = current.items.length - 1;
  current.items.forEach((it, i) => chat.appendChild(it.role === "user" ? userRow(it) : botRow(it, i, i === last)));
  updateContext();
  if (!empty) scrollDown(); else $("thread").scrollTop = 0;
  save();
}
function welcome() {
  const w = el("section", "welcome");
  w.innerHTML = `<div class="logo" aria-hidden="true">${LOGO}</div>`;
  w.appendChild(el("h2", "", "Facts about 5 HDFC mutual funds"));
  w.appendChild(el("p", "", "Every answer comes from an official HDFC, SEBI or AMFI document and links to the exact page."));
  return w;
}
function renderStarters() {
  const chips = $("chips"); chips.innerHTML = "";
  examples.forEach((q) => { const b = el("button", "chip"); b.type = "button"; b.append(q); b.insertAdjacentHTML("afterbegin", ICON.arrow); b.onclick = () => ask(q); chips.appendChild(b); });
  const pills = $("pills"); pills.innerHTML = "";

}
function userRow(it) {

  const b = el("div", "bubble" + (it.masked ? " masked" : ""), it.masked ? "Message hidden - it contained personal information" : it.text);
  if (it.at) b.title = clock(it.at);
  row.appendChild(b);
  if (it.contextName) row.appendChild(el("div", "ctx-note", `About ${it.contextName}`));
  return row;
}
function writerLabel(r) {  // says only what the backend did: who wrote the text, and that its citation checks passed
  const who = { gemini: "Gemini", anthropic: "Claude" }[(r.writer || "").split("/")[0]];
  if (who) return [`Written by ${who} · citation checked`, `Written by ${who} using only the cited passage. `];
  return [r.writer === "fact table" || r.writer === "quote" ? "Quoted from source" : "Cited answer", "Text taken from the cited source. "];
}
function botRow(it, index, isLast) {
  const row = el("div", "msg bot");
  if (it.state === "loading") {
    const t = el("div", "typing"); t.setAttribute("role", "status");
    t.innerHTML = '<span class="spin" aria-hidden="true"></span><span>Checking official sources…</span>';
    row.appendChild(t); return row;
  }
  if (it.state === "error") {
    const l = el("div", "state-label"); l.innerHTML = ICON.info; l.append(STATE_LABEL.error); row.appendChild(l);
    row.appendChild(el("div", "answer-text", it.errorText));
    const retry = el("button", "btn retry", "Try again"); retry.type = "button";
    retry.onclick = () => resend(index);
    row.appendChild(retry);
    return row;
  }
  const r = it.answer;
  if (STATE_LABEL[r.type]) { const l = el("div", "state-label"); l.innerHTML = ICON.info; l.append(STATE_LABEL[r.type]); row.appendChild(l); }
  row.appendChild(el("div", "answer-text", r.text));

  if (r.source_url && officialUrl(r.source_url)) {  // exactly one official link, as returned by the backend
    const { title, page } = splitTitle(r.source_title);
    const c = el("a", "source"); c.href = pageLink(r.source_url, r.source_title); c.target = "_blank"; c.rel = "noopener noreferrer";
    c.title = r.source_url;
    const ic = el("span", "ic"); ic.innerHTML = ICON.doc; c.appendChild(ic);
    const body = el("span", "body");
    body.appendChild(el("span", "t", (r.type === "answer" ? "" : "Official resource: ") + (title || r.source_url)));
    body.appendChild(el("span", "h", new URL(r.source_url).hostname + (page ? ` · opens at page ${page}` : "")));
    c.appendChild(body); c.insertAdjacentHTML("beforeend", `<span class="go">${ICON.ext}</span>`);
    row.appendChild(c);
  }
  const gw = it.topic && GROWW[it.topic.scheme];
  if (gw && (r.type === "answer" || r.type === "not_found")) row.appendChild(growwLink(gw, "Easier read on Groww"));

  // one quiet line: the actions, then a single sentence on how it was written, freshness and time
  const meta = el("div", "meta"), acts = el("div", "acts"), msg = el("span", "act-msg");
  acts.appendChild(copyButton(r, msg));
  feedbackButtons(it, msg).forEach((b) => acts.appendChild(b));
  let panel = null;
  if (r.evidence && r.evidence.length) {
    const why = el("button", "why", "Why this answer"); why.type = "button"; why.setAttribute("aria-expanded", "false");
    panel = whyPanel(r); panel.hidden = true; panel.id = "why-" + index; why.setAttribute("aria-controls", panel.id);
    why.onclick = () => { panel.hidden = !panel.hidden; why.setAttribute("aria-expanded", String(!panel.hidden)); };
    acts.appendChild(why);
  }
  acts.appendChild(msg);
  meta.appendChild(acts);
  const parts = [], info = el("span", "info");
  if (r.type === "answer") { const [label, tip] = writerLabel(r); parts.push(label);
    info.title = tip + "Before it was shown, the server checked that the citation is one of the retrieved passages, the link is a registered "
      + "official source, every number appears in that passage, and the answer is at most 3 sentences with no advice wording."; }
  if (r.last_updated) parts.push("Last updated from sources " + r.last_updated);
  if (it.at) parts.push(clock(it.at));
  info.textContent = parts.join(" · ");
  meta.appendChild(info);
  row.appendChild(meta);
  if (panel) row.appendChild(panel);
  if (isLast && it.followups && it.followups.length) {   // suggestions only under the latest answer
    const f = el("div", "followups"); f.setAttribute("aria-label", "Suggested follow-up questions");
    it.followups.forEach((q) => { const x = el("button", "fu", q); x.type = "button"; x.onclick = () => ask(q); f.appendChild(x); });
    row.appendChild(f);
  }
  return row;
}
function whyPanel(r) {
  const d = el("div", "why-panel");
  d.appendChild(el("div", "", r.path === "fact" ? "Exact fact lookup - taken from a quoted line of the source, no AI writing."
    : "Retrieved passages ranked by similarity (adjustments shown); the answer was checked against the cited passage."));
  const ul = el("ul", "ev");
  r.evidence.forEach((e) => {
    const li = el("li");
    const adj = e.adjustments && Object.keys(e.adjustments).length ? "  ·  " + Object.entries(e.adjustments).map(([k, v]) => `${k} ${v}`).join(", ") : "";
    li.appendChild(el("span", "id", `${e.chunk_id}  ·  score ${e.score.toFixed(3)}${adj}`));
    li.appendChild(el("span", "q", "“" + e.quote + (e.quote.length >= 220 ? "…" : "") + "”"));
    ul.appendChild(li);
  });
  d.appendChild(ul);
  return d;
}
function copyButton(r, msg) {
  const copy = el("button", "act"); copy.type = "button"; copy.innerHTML = ICON.copy; copy.title = "Copy answer"; copy.setAttribute("aria-label", "Copy answer");
  copy.onclick = async () => {
    const txt = r.text + (r.source_url && officialUrl(r.source_url) ? `\nSource: ${r.source_title || ""} - ${pageLink(r.source_url, r.source_title)}` : "");
    try { await navigator.clipboard.writeText(txt); msg.textContent = "Copied"; }
    catch (e) { msg.textContent = "Copy not available"; }
    setTimeout(() => { msg.textContent = ""; }, 1800);
  };
  return copy;
}
// Visual-only feedback: kept in this tab, not sent anywhere (no feedback endpoint yet).
function feedbackButtons(it, msg) {
  const btns = [["up", "Helpful"], ["down", "Not helpful"]].map(([k, label]) => {
    const b = el("button", "act"); b.type = "button"; b.innerHTML = ICON[k]; b.dataset.fb = k;
    b.title = `${label} (feedback isn't sent anywhere yet)`; b.setAttribute("aria-label", label);
    b.setAttribute("aria-pressed", it.feedback === k ? "true" : "false");
    return b;
  });
  btns.forEach((b) => { b.onclick = () => {
    it.feedback = it.feedback === b.dataset.fb ? null : b.dataset.fb;
    save();
    btns.forEach((x) => x.setAttribute("aria-pressed", it.feedback === x.dataset.fb ? "true" : "false"));
    msg.textContent = it.feedback ? "Thanks - noted in this tab only" : "";
  }; });
  return btns;
}

/* ---------------- follow-up suggestions (derived from the backend response) ---------------- */
function followups(r, question, topic) {
  const s = topic.scheme && schemeById(topic.scheme);
  // scheme suggestions only for facts the backend's fact sheet (/api/schemes) actually has - never a missing one
  const have = s && s.facts ? new Set(s.facts.map((f) => f.field)) : null;
  const forScheme = (skip) => have ? FIELD_ORDER.filter((f) => f !== skip && have.has(f))
    .slice(0, 3).map((f) => FIELD_Q[f].replace("{n}", s.name)) : GENERIC;
  if (r.type === "refusal_pii") return GENERIC;
  if (r.type === "refusal_advice" || r.type === "refusal_returns") return s ? forScheme(null) : GENERIC;
  if (r.type === "not_found") return s ? forScheme(topic.field) : examples.slice(0, 3);
  if (s) return forScheme(topic.field);
  const hit = CONCEPTS.find(([re]) => re.test(question) || re.test(r.text));
  return (hit ? hit[1] : GENERIC).filter((q) => q.toLowerCase() !== question.toLowerCase()).slice(0, 3);
}

/* ---------------- asking ---------------- */
function contextFor(question) {
  if (detectScheme(question)) return null;                    // the question names its own scheme
  if (current.pinned) return current.pinned;                  // explicit choice from the schemes panel
  if (current.lastScheme && REFERS_BACK.test(question)) return current.lastScheme;  // clear reference back
  return null;
}
async function ask(q) {
  q = (q || "").trim();
  if (!q || pending) return;
  $("q").value = ""; autoSize(); updateCount();
  const ctx = contextFor(q);
  const user = { role: "user", text: q, contextName: ctx ? schemeById(ctx)?.name : null, schemeId: ctx, at: new Date() };
  if (!current.items.length) current.title = q.length > 48 ? q.slice(0, 46) + "…" : q;
  current.items.push(user);
  await fetchAnswer(user);
}
async function fetchAnswer(user, at = current.items.length) {  // `at`: where the answer goes (retry keeps its place)
  pending = true; $("send").disabled = true;
  const conv = current;                                       // the user may switch chats while waiting
  const bot = { role: "bot", state: "loading" };
  conv.items.splice(at, 0, bot); render();
  try {
    const body = { message: user.text }; if (user.schemeId) body.scheme_id = user.schemeId;
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    let r = null; try { r = await res.json(); } catch (e) {}
    if (!res.ok || !r || !r.type || r.type === "error") {
      bot.state = "error";
      bot.errorText = res.status === 422 ? "That question couldn't be processed. Please keep it under 500 characters." : "The answer service didn't respond properly. Please try again.";
    } else {
      bot.state = "done"; bot.answer = r;
      if (r.type === "refusal_pii") {                          // never keep personal data, even in this tab
        user.masked = true; user.text = "";
        if (conv.items[0] === user) conv.title = "Personal information (hidden)";
      }
      const topic = answerTopic(r, user.masked ? "" : user.text);
      bot.topic = topic;
      if (r.type === "answer" && topic.scheme) conv.lastScheme = topic.scheme;
      bot.followups = followups(r, user.masked ? "" : user.text, topic);
    }
  } catch (e) {
    bot.state = "error"; bot.errorText = "Couldn't reach FundFacts AI. Check your connection and try again.";
  } finally {
    bot.at = new Date();
    pending = false; render(); updateSend(); $("q").focus();
  }
}
function resend(index) {  // retry an errored answer without duplicating the question
  const user = current.items[index - 1];
  if (!user || pending) return;
  current.items.splice(index, 1);
  fetchAnswer(user, index);
}

/* ---------------- composer ---------------- */
const input = $("q");
function autoSize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 168) + "px"; }
// the counter only appears near the limit, so the composer stays compact
function updateCount() { $("count").textContent = `${input.value.length}/500`; $("count").hidden = input.value.length < 400; updateSend(); }
function updateSend() { $("send").disabled = pending || !input.value.trim(); }
input.addEventListener("input", () => { autoSize(); updateCount(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });

function updateContext() {
  const s = current.pinned && schemeById(current.pinned);
  $("context").classList.toggle("on", !!s);
  $("contextName").textContent = s ? s.name : "";
  input.placeholder = s ? `Ask about ${short(s.name)}…` : current.items.length ? "Ask another question…" : "Ask a factual question…";
}
$("contextClear").onclick = () => { current.pinned = null; updateContext(); input.focus(); };

/* ---------------- schemes panel ---------------- */
let lastFocus = null;
function openDrawer(id) {
  lastFocus = document.activeElement;
  $("drawer").classList.add("open"); $("scrim").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  id ? showScheme(id) : showList();
  setTimeout(() => $("drawerClose").focus(), 50);
}
function closeDrawer() {
  $("drawer").classList.remove("open"); $("scrim").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  if (lastFocus) lastFocus.focus();
}
function showList() {
  $("drawerTitle").textContent = "Schemes"; $("drawerBack").hidden = true;
  const body = $("drawerBody"); body.innerHTML = "";
  body.appendChild(el("p", "drawer-note", "Five HDFC Mutual Fund schemes, Direct Plan - Growth. Pick one to see its facts or ask about it."));
  const list = el("div", "scheme-list");
  schemes.forEach((s) => {
    const b = el("button", "scheme-row"); b.type = "button";
    const t = el("span"); t.appendChild(el("span", "t", s.name));
    t.appendChild(el("span", "s", s.facts ? `${s.category} · ${s.facts.length} facts from official documents` : s.category));
    b.appendChild(t); b.insertAdjacentHTML("beforeend", ICON.chev);
    b.onclick = () => showScheme(s.scheme_id);
    list.appendChild(b);
  });
  body.appendChild(list);
  body.appendChild(growwLink(GROWW_AMC, "All HDFC schemes on Groww"));
}
function showScheme(id) {
  const s = schemeById(id);
  if (!s) return showList();
  $("drawerTitle").textContent = s.name; $("drawerBack").hidden = false;
  const body = $("drawerBody"); body.innerHTML = "";
  const askBtn = el("button", "btn primary", `Ask about ${short(s.name)}`); askBtn.type = "button";
  askBtn.onclick = () => { current.pinned = s.scheme_id; updateContext(); closeDrawer(); input.focus(); };
  body.appendChild(askBtn);
  if (!s.facts) { body.appendChild(el("p", "missing", "The fact sheet couldn't be loaded. You can still ask questions about this scheme.")); return; }
  const list = el("div", "facts");
  s.facts.forEach((f) => {
    const card = el("div", "fact");
    card.appendChild(el("div", "k", f.label));
    const v = el("div", "v", f.value); card.appendChild(v);
    if (f.value.length > 160) {
      v.classList.add("long");
      const more = el("button", "more", "Show more"); more.type = "button";
      more.onclick = () => { const o = v.classList.toggle("open"); more.textContent = o ? "Show less" : "Show more"; };
      card.appendChild(more);
    }
    if (f.source_url && officialUrl(f.source_url)) {
      const src = el("div", "src");
      if (f.as_of) src.append(`As on ${f.as_of} · `);
      const a = el("a", "", f.source_title); a.href = pageLink(f.source_url, f.source_title); a.target = "_blank"; a.rel = "noopener noreferrer";
      src.appendChild(a); card.appendChild(src);
    }
    list.appendChild(card);
  });
  body.appendChild(list);
  if (s.missing && s.missing.length) body.appendChild(el("p", "missing", `Not stated in my sources: ${s.missing.join(", ")}. I won't guess these.`));
  if (GROWW[s.scheme_id]) body.appendChild(growwLink(GROWW[s.scheme_id], `${short(s.name)} on Groww`));
  if (s.questions && s.questions.length) {
    body.appendChild(el("p", "drawer-label", "Quick questions"));
    const qs = el("div", "chips");
    s.questions.forEach((q) => { const b = el("button", "chip"); b.type = "button"; b.append(q); b.insertAdjacentHTML("afterbegin", ICON.arrow); b.onclick = () => { closeDrawer(); ask(q); }; qs.appendChild(b); });
    body.appendChild(qs);
  }
}
$("exploreBtn").onclick = () => openDrawer(null);
$("drawerClose").onclick = closeDrawer;
$("drawerBack").onclick = showList;
$("scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("drawer").classList.contains("open")) closeDrawer();
  else if (mobile() && sidebarOpen()) setSidebar(false);
});

/* ---------------- start ---------------- */
restore() || newConv();
fetch("/api/meta").then((r) => (r.ok ? r.json() : null)).then((m) => {
  if (m && Array.isArray(m.examples) && m.examples.length) { examples = m.examples; if (!current.items.length) render(); }
}).catch(() => {});
fetch("/api/schemes").then((r) => (r.ok ? r.json() : null)).then((d) => {
  if (d && Array.isArray(d.schemes) && d.schemes.length) { schemes = d.schemes; if (!current.items.length) render(); }
}).catch(() => {});
</script>
</body>
</html>
