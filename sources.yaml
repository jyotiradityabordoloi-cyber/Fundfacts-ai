# FundFacts AI - source registry (the allowlist).
# Only these URLs are ever fetched; links inside them are never followed.
# Publishers are restricted to the AMC (HDFC Mutual Fund), SEBI and AMFI.
#
# status:
#   active     - fetched automatically by the pipeline
#   manual     - www.hdfcfund.com blocks automated requests (HTTP 403); the owner saves the
#                page/file into data/manual/<source_id>.<ext>. The URL below stays the citation.
#   blocked    - not fetchable and not ingested (kept for transparency)
#   historical - superseded; excluded from the corpus

sources:
  # ---------------------------------------------------------------- AMC: scheme documents
  - source_id: hdfc_large_cap_sid
    url: https://files.hdfcfund.com/s3fs-public/SID/2025-11/SID%20-%20HDFC%20Large%20Cap%20Fund%20dated%20November%2021,%202025.pdf
    publisher: AMC
    doc_type: SID
    title: Scheme Information Document - HDFC Large Cap Fund (21 Nov 2025)
    scheme_id: hdfc_large_cap
    notes: Objective, asset allocation, benchmark, exit load, minimum application amounts, plans/options.

